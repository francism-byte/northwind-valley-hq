} onchange="S.counts['${k}']=Number(this.value);save();render()">${bar(S.counts[k]||0,v)}</label>`).join('')}<h3>Academic commitments</h3><p>Mon no classes; Tue 8–3; Wed 1–6; Thu 10–3; Fri 8–9 & 3–5; Sat 4–6; Sun church 6–8.</p>${S.days.map((d,i)=>`<section>Day ${i+1}<div class=fields>${['date','window','hours','study','cut','target'].map(k=>`<label>${k==='cut'?'Additional academic hours reducing capacity':k}<input type=${k==='date'?'date':k==='window'?'text':'number'} value="${esc(d[k])}" onchange="dayedit(${i},'${k}',${['date','window'].includes(k)?'this.value':'Number(this.value)'})"></label>`).join('')}</div></section>`).join('')}`;m.innerHTML=h;if(open){let el=m.querySelector('[data-id="'+open+'"]');if(el){el.open=true;window.scrollTo(0,oldScroll)}}}function reforecast(){let r=rate();if(!r)return alert('Log architecture hours and approvals first.');let a=aCount();S.days.forEach(d=>{if(d.date>=new Date().toISOString().slice(0,10)){a=Math.min(60,a+r*Math.max(0,d.hours-d.cut));d.target=Math.floor(a)}});save();render()}function exportReports(){download(S.days.map((d,i)=>report(i)).join('\n'),'Northwind-report.txt')}function download(t,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function load(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.rows)||x.days?.length!==7||!x.targets||!x.counts)throw Error();if(confirm('Replace current progress with imported backup?')){S=x;save();render()}}catch{alert('Invalid backup file')}}render();</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("./sw.js").catch(console.error);}</script></body></html>
